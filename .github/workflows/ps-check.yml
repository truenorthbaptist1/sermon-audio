name: PowerShell check
on:
  push:
    paths: ['windows/**', '.github/workflows/ps-check.yml']
jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem windows -Filter *.ps1 | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            foreach ($x in $e) { Write-Host "$($_.Name):$($x.Extent.StartLineNumber): $($x.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
          Write-Host 'All scripts parse.'
      - name: Run-ToolWatch calls its tick while a tool runs
        shell: powershell
        run: |
          $Tools = 'C:\Windows\System32'
          $src = Get-Content windows\sermon-audio.ps1 -Raw
          $q = [regex]::Match($src, '(?s)function Quote-Arg.*?\n}\r?\n').Value
          $w = [regex]::Match($src, '(?s)function Run-ToolWatch.*?\n}\r?\n').Value
          if (-not $w) { throw 'Run-ToolWatch not found' }
          Invoke-Expression $q; Invoke-Expression $w
          foreach ($f in 'Kill-Tree', 'Wait-Tool') { Invoke-Expression ([regex]::Match($src, "(?s)function $f.*?\n}\r?\n").Value) }
          $script:beats = 0
          function Save-Status { $script:beats++ }
          $n = 0; $outer = 'seen'
          $r = Run-ToolWatch 'PING.EXE' @('-n', '45', '127.0.0.1') '' { $script:n++; if ($outer -ne 'seen') { throw 'scope' } }
          Write-Host "exit $($r.code), ticks $n"
          Write-Host "heartbeats $beats"
          if ($r.code -ne 0 -or $n -lt 1 -or $beats -lt 1) { exit 1 }
      - name: A stuck part is found and stopped, and its mutex can be taken over (1.9.6)
        shell: powershell
        run: |
          $src = Get-Content windows\sermon-audio.ps1 -Raw
          foreach ($f in 'Kill-Tree', 'Stuck-Pid') { Invoke-Expression ([regex]::Match($src, "(?s)function $f.*?\n}\r?\n").Value) }
          $dir = Join-Path $env:TEMP 'tnbc-test'; New-Item -ItemType Directory -Force $dir | Out-Null
          # a "stuck helper": holds the posts mutex and sleeps
          $holder = Start-Process powershell.exe -PassThru -WindowStyle Hidden -ArgumentList '-NoProfile -Command "$m = New-Object System.Threading.Mutex($false, ''Local\TNBCSermonAudio-posts''); [void]$m.WaitOne(0); Start-Sleep 600"'
          Start-Sleep 4
          $file = Join-Path $dir 'status-posts.json'
          @{ pid = $holder.Id; state = 'running'; beat = (Get-Date).AddHours(-2).ToString('o'); startedAt = (Get-Date).AddHours(-3).ToString('o') } | ConvertTo-Json | Set-Content $file
          $m = New-Object System.Threading.Mutex($false, 'Local\TNBCSermonAudio-posts')
          $free = $false; try { $free = $m.WaitOne(0) } catch [System.Threading.AbandonedMutexException] { $free = $true }
          if ($free) { throw 'the test holder did not get the mutex' }
          $sp = Stuck-Pid $file
          if ($sp -ne $holder.Id) { throw "Stuck-Pid gave $sp, expected $($holder.Id)" }
          # a fresh heartbeat is not stuck
          @{ pid = $holder.Id; state = 'running'; beat = (Get-Date).ToString('o') } | ConvertTo-Json | Set-Content (Join-Path $dir 'fresh.json')
          if ((Stuck-Pid (Join-Path $dir 'fresh.json')) -ne 0) { throw 'a fresh heartbeat was called stuck' }
          Kill-Tree $sp
          Start-Sleep 3
          $got = $false; try { $got = $m.WaitOne(5000) } catch [System.Threading.AbandonedMutexException] { $got = $true }
          if (-not $got) { throw 'could not take the mutex over after stopping the stuck part' }
          Write-Host 'Stuck part found, stopped, mutex taken over; fresh heartbeat left alone.'
      - name: A stuck part from 1.9.5 or older (no pid in its status file) is found by its command line (1.9.7)
        shell: powershell
        run: |
          $src = Get-Content windows\sermon-audio.ps1 -Raw
          foreach ($f in 'Kill-Tree', 'Stuck-Pid') { Invoke-Expression ([regex]::Match($src, "(?s)function $f.*?\n}\r?\n").Value) }
          $dir = Join-Path $env:TEMP 'tnbc-old'; New-Item -ItemType Directory -Force $dir | Out-Null
          $fake = Join-Path $dir 'sermon-audio.ps1'
          Set-Content $fake 'param([string]$Part) $m = New-Object System.Threading.Mutex($false, "Local\TNBCSermonAudio-posts"); [void]$m.WaitOne(0); Start-Sleep 600'
          $old = Start-Process powershell.exe -PassThru -WindowStyle Hidden -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$fake`" -Part posts"
          $reels = Start-Process powershell.exe -PassThru -WindowStyle Hidden -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$fake`" -Part reels"
          Start-Sleep 4
          $file = Join-Path $dir 'status-posts.json'
          @{ state = 'running'; startedAt = (Get-Date).AddHours(-3).ToString('o') } | ConvertTo-Json | Set-Content $file
          # recently written: not stuck yet
          if ((Stuck-Pid $file) -ne 0) { throw 'a recently written old status file was called stuck' }
          (Get-Item $file).LastWriteTime = (Get-Date).AddHours(-2)
          $sp = Stuck-Pid $file
          if ($sp -ne $old.Id) { throw "Stuck-Pid gave $sp, expected the posts helper $($old.Id) (reels is $($reels.Id))" }
          Kill-Tree $sp; Start-Sleep 3
          if (Get-Process -Id $old.Id -ErrorAction SilentlyContinue) { throw 'the old helper is still running' }
          if (-not (Get-Process -Id $reels.Id -ErrorAction SilentlyContinue)) { throw 'the reels helper was stopped too' }
          $m = New-Object System.Threading.Mutex($false, 'Local\TNBCSermonAudio-posts')
          $got = $false; try { $got = $m.WaitOne(5000) } catch [System.Threading.AbandonedMutexException] { $got = $true }
          if (-not $got) { throw 'could not take the mutex over' }
          Kill-Tree $reels.Id
          Write-Host 'Old-style stuck posts helper found by command line and stopped; the reels helper left alone.'
      - name: The status window shows the Facebook video's progress (tray 2.2.0)
        shell: powershell
        run: |
          $src = Get-Content windows\status-tray.ps1 -Raw
          Invoke-Expression ([regex]::Match($src, '(?s)\$FbStages = .*?\n').Value)
          Invoke-Expression ([regex]::Match($src, '(?s)function Part-State.*?\n}\r?\n').Value)
          $Mid = '-'; $MutexOf = @{ posts = 'x' }
          function Part-Running($n) { $true }
          function When($x) { 'earlier' }
          # from the local status file (program 1.9.8+)
          function Read-Part($p) { [pscustomobject]@{ current = 'Facebook video: DNA 14'; fb = [pscustomobject]@{ stage = 'encode'; pct = 34 } } }
          $r = Part-State 'posts'
          Write-Host $r.text
          if ($r.pct -ne 34 -or $r.text -notmatch 'Editing the video - 34%') { throw 'local progress not shown' }
          # from the manager (older helper, no fb in its file)
          function Read-Part($p) { [pscustomobject]@{ current = 'Checking for posts' } }
          $script:Overview = '{"facebook":{"progress":[{"title":"DNA 14","stage":"upload","pct":72}]}}' | ConvertFrom-Json
          $r = Part-State 'posts'
          Write-Host $r.text
          if ($r.pct -ne 72 -or $r.text -notmatch 'Uploading to Facebook - 72%') { throw 'manager progress not shown' }
          # no progress anywhere: plain text, no bar value
          $script:Overview = $null
          $r = Part-State 'posts'
          if ($null -ne $r.pct -or $r.state -ne 'watching') { throw 'a bar appeared with no progress, or the idle helper was not shown as waiting' }
          Write-Host 'Facebook progress shown in the status window.'
