name: tray window test
on: { push: { branches: [tmp-tray], paths-ignore: ['shots/**'] } }
permissions: { contents: write }
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ptest\tray.ps1
      - if: always()
        shell: bash
        run: |
          mkdir -p shots && mv working.png idle.png shots/ || true
          git config user.name ci && git config user.email ci@example.com
          git add shots && git commit -m "shots" && git push origin HEAD:tmp-tray
