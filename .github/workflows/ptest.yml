name: parse test
on: { push: { branches: [tmp-tray], paths-ignore: ['shots/**'] } }
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          foreach ($f in 'windows\sermon-audio.ps1','windows\status-tray.ps1') { $e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$e); if ($e.Count) { $e | % { Write-Host "$f : $($_.Message) line $($_.Extent.StartLineNumber)" }; exit 1 } else { Write-Host "$f parses" } }
